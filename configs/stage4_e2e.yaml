stage: e2e
epochs: 80
batch_size: 2
num_workers: 2
lr: 0.00005
weight_decay: 0.0001
amp: true
out_dir: checkpoints/stage4_e2e

model:
    c0: 32
    c1: 64
    c2: 128
    use_time: true

simulator:
    severity: medium

data:
    train_root: datasets/clean/train
    val_root: datasets/clean/val
    crop_size: 256
    fps: 24.0
    temporal_policy: k9_200ms

loss:
    edge: 0.05

aux_weights:
    align: 0.0
    smooth: 0.01
    oracle: 0.0
