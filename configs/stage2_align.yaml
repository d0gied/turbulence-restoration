stage: align
epochs: 20
batch_size: 4
num_workers: 0
lr: 0.0001
weight_decay: 0.0001
amp: true
out_dir: checkpoints/stage2_align

model:
    c0: 32
    c1: 64
    c2: 128
    use_time: true

simulator:
    severity: weak
    on_device: true

data:
    train_root: datasets/clean/train
    val_root: datasets/clean/val
    train_cache: datasets/cache/clean_train.pt
    val_cache: datasets/cache/clean_val.pt
    crop_size: 240
    fps: 24.0
    temporal_policy: k9_200ms
    preload: true

loss:
    edge: 0.05

aux_weights:
    align: 1.0
    smooth: 0.01
    oracle: 0.0
