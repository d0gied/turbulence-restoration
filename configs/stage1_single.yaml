stage: single
epochs: 30
batch_size: 4
num_workers: 8
lr: 0.0002
weight_decay: 0.0001
amp: true
out_dir: checkpoints/stage1_single_boosted

model:
    c0: 32
    c1: 64
    c2: 128
    use_time: true

simulator:
    severity: weak

data:
    train_root: datasets/clean/train
    val_root: datasets/clean/val
    crop_size: 240
    fps: 24.0
    temporal_policy: k1_center

loss:
    edge: 0.05
