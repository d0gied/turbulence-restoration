stage: single
epochs: 30
batch_size: 4
num_workers: 2
lr: 0.0002
weight_decay: 0.0001
amp: true
out_dir: checkpoints/stage1_single

model:
  c0: 32
  c1: 64
  c2: 128
  use_time: true

simulator:
  severity: medium

data:
  num_samples: 1000
  num_clean_frames: 40
  image_size: 256
  fps: 60.0
  temporal_policy: k1_center

loss:
  edge: 0.05
