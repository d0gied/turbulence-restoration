stage: e2e
epochs: 1
batch_size: 1
num_workers: 0
lr: 0.00005
weight_decay: 0.0001
amp: true
out_dir: checkpoints/smoke

model:
    c0: 8
    c1: 16
    c2: 32
    use_time: true

simulator:
    severity: medium

data:
    train_root: datasets/clean/train
    val_root: datasets/clean/val
    crop_size: 48
    fps: 24.0
    temporal_policy: k9_200ms

loss:
    edge: 0.05

aux_weights:
    align: 0.0
    smooth: 0.01
    oracle: 0.0
